<!DOCTYPE html>
<html>
<head>
    <title>SkillLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">SkillLink</a>

        <div>
            <a class="btn btn-outline-light me-2" href="/skills/">Skills</a>
            <a class="btn btn-outline-light me-2" href="/exchange/">Requests</a>
            <a class="btn btn-outline-light me-2" href="/reports/">Reports</a>

            {% if user.is_authenticated %}
                <a class="btn btn-warning" href="/accounts/logout/">Logout</a>
            {% else %}
                <a class="btn btn-success" href="/accounts/login/">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
